name: Extension checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      VSCODE_TEST_VERSION: 1.136.1
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - name: Install Tcl on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tcl8.6 tcl-thread
      - name: Install Tcl on macOS
        if: runner.os == 'macOS'
        run: brew install tcl-tk && echo "$(brew --prefix tcl-tk)/bin" >> "$GITHUB_PATH"
      - name: Install Tcl on Windows
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-tcl
      - name: Add Tcl to Windows PATH
        if: runner.os == 'Windows'
        env:
          TCL_BIN: ${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin
        run: $env:TCL_BIN | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Report Tcl capabilities
        run: node -e "process.stdout.write(require('child_process').execFileSync('tclsh', {input:'puts [info patchlevel]\nputs [info commands oo::class]\ncatch {puts [package require Thread]}\n', encoding:'utf8'}))"
      - run: npm ci
      - name: Release validation tests
        run: node --test .github/scripts/prepare-release.test.mjs
      - run: npm run lint
      - run: npm run test:unit
      - name: Extension host (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test
      - name: Extension host (macOS and Windows)
        if: runner.os != 'Linux'
        run: npm test
